frr version 9.1.3
frr defaults traditional
hostname as102r1
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip address 1.0.0.5/31
exit
!
interface eth1
 ip address 1.102.3.0/31
 ip ospf cost 5
exit
!
interface eth2
 ip address 1.102.3.2/31
 ip ospf cost 9
exit
!
interface eth3
 ip address 1.102.3.5/31
 ip ospf cost 10
exit
!
interface dummy0
 ip address 1.102.4.1/32
exit
!
router ospf
 network 1.102.3.0/31 area 0.0.0.0
 network 1.102.3.2/31 area 0.0.0.0
 network 1.102.3.4/31 area 0.0.0.0
 network 1.102.4.1/32 area 0.0.0.0
 default-information originate always metric 10 metric-type 1 route-map CHECK-AS1
!
router bgp 102
 bgp router-id 1.102.4.1
 neighbor 1.0.0.4 remote-as 1
 neighbor 1.102.4.2 remote-as 102
 neighbor 1.102.4.2 update-source dummy0
 !
 address-family ipv4 unicast
  network 1.102.4.1/32
  aggregate-address 1.102.0.0/20 summary-only
  neighbor 1.0.0.4 send-community
  neighbor 1.0.0.4 route-map FROM-AS1 in
  neighbor 1.0.0.4 route-map TO-AS1 out
  neighbor 1.102.4.2 next-hop-self
!
ip prefix-list OWN seq 5 permit 1.102.0.0/20
ip prefix-list AS21 seq 5 permit 2.21.0.0/20
!
route-map FROM-AS1 permit 10
 set local-preference 100
!
route-map TO-AS1 permit 10
 match ip address prefix-list OWN
 set community 1:200
!
route-map TO-AS1 permit 20
 match ip address prefix-list AS21
 set as-path prepend 102
!
